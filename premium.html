<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050b">
  <meta name="description" content="EarthPulse — professional Earth intelligence and environmental telemetry.">
  <title>EarthPulse — Earth Intelligence</title>
  <script>window.si=window.si||function(){(window.siq=window.siq||[]).push(arguments)};</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{width:100%;height:100%;position:relative;background:#02050b}#earthpulse-frame{width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .45s ease;background:#02050b}#boot{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#0a1b30 0,#030711 38%,#02050b 78%);color:#dff8ff;transition:opacity .35s ease,visibility .35s ease}.boot-inner{width:min(460px,86vw);text-align:center}.mark{width:64px;height:64px;margin:0 auto 20px;border:1px solid rgba(103,232,249,.42);border-radius:20px;display:grid;place-items:center;box-shadow:0 0 55px rgba(34,211,238,.16),inset 0 0 28px rgba(34,211,238,.06)}.mark:before{content:"";width:26px;height:26px;border:2px solid #67e8f9;border-radius:50%;box-shadow:inset 0 0 12px rgba(103,232,249,.35),0 0 18px rgba(103,232,249,.25)}.title{font:800 18px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}.sub{margin-top:9px;color:#72839a;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.bar{height:2px;margin-top:24px;overflow:hidden;background:rgba(148,163,184,.12);border-radius:999px}.bar i{display:block;width:38%;height:100%;background:#67e8f9;box-shadow:0 0 16px #67e8f9;animation:scan 1.2s infinite ease-in-out}@keyframes scan{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}#boot.hide{opacity:0;visibility:hidden;pointer-events:none}#credit{position:absolute;right:14px;bottom:10px;z-index:5;color:rgba(148,163,184,.55);font:9px ui-monospace,monospace;letter-spacing:.08em;pointer-events:none}@media(max-width:640px){#credit{font-size:8px;right:9px;bottom:7px}}
  </style>
</head>
<body>
<div id="app">
  <div id="boot"><div class="boot-inner"><div class="mark"></div><div class="title">EARTHPULSE</div><div class="sub">INITIALIZING EARTH INTELLIGENCE</div><div class="bar"><i></i></div></div></div>
  <iframe id="earthpulse-frame" title="EarthPulse Earth Intelligence"></iframe>
  <div id="credit">MADE BY PRATYUSH &amp; CO</div>
</div>
<script>
const frame=document.getElementById('earthpulse-frame');
const boot=document.getElementById('boot');
frame.src='earthpulse1.html';
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const link=doc.createElement('link');
    link.rel='stylesheet';
    link.href='premium-ui.css';
    doc.head.appendChild(link);
    doc.documentElement.style.background='#02050b';
    doc.body.style.background='#02050b';
  }catch(error){console.warn('EarthPulse premium layer could not attach:',error)}
  frame.style.opacity='1';
  setTimeout(()=>boot.classList.add('hide'),180);
});
</script>
</body>
</html>
