<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EarthPulse — Planetary Intelligence Command Center</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#03060b;overflow:hidden}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#overlay{position:fixed;inset:0;z-index:50;pointer-events:none}
#cursor-glow{position:fixed;left:0;top:0;width:190px;height:190px;border-radius:50%;pointer-events:none;z-index:100;opacity:0;transform:translate3d(-50%,-50%,0);background:radial-gradient(circle,rgba(140,240,242,.18) 0%,rgba(140,240,242,.08) 25%,rgba(189,140,255,.045) 46%,transparent 72%);filter:blur(12px);mix-blend-mode:screen;transition:width .22s ease,height .22s ease,opacity .2s ease;will-change:transform,width,height}
#egg{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid rgba(255,255,255,.95);border-radius:50%;background:#7ee8ff;box-shadow:0 0 0 7px rgba(126,232,255,.12),0 0 22px 6px rgba(126,232,255,.8),0 0 55px rgba(126,232,255,.5);cursor:pointer;pointer-events:auto;animation:pulse 1.5s ease-in-out infinite;transition:left .15s ease,top .15s ease}
#egg:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
#label{position:absolute;transform:translate(-50%,-34px);padding:7px 10px;border:1px solid rgba(126,232,255,.35);border-radius:999px;background:rgba(3,7,12,.88);backdrop-filter:blur(14px);color:#bdefff;font:900 8px/1 Inter,system-ui,sans-serif;letter-spacing:.16em;white-space:nowrap;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#brand{position:absolute;transform:translateX(-50%);color:rgba(240,250,255,.8);font:950 8px/1 Inter,system-ui,sans-serif;letter-spacing:.24em;white-space:nowrap;text-shadow:0 2px 12px #000;pointer-events:none}
#popup{position:fixed;right:28px;top:50%;width:min(350px,calc(100vw - 40px));padding:20px;border:1px solid rgba(126,232,255,.3);border-radius:22px;background:linear-gradient(145deg,rgba(10,18,27,.97),rgba(2,6,11,.98));color:#f4f7fb;box-shadow:0 35px 120px rgba(0,0,0,.7),0 0 50px rgba(126,232,255,.12);backdrop-filter:blur(25px);transform:translateY(-50%) translateX(20px);opacity:0;visibility:hidden;transition:.22s ease;pointer-events:none;font-family:Inter,system-ui,sans-serif}
#popup.open{opacity:1;visibility:visible;transform:translateY(-50%);pointer-events:auto}
.top{display:flex;align-items:center;gap:7px;color:#7ee8ff;font-size:8px;font-weight:950;letter-spacing:.2em}.top i{width:6px;height:6px;border-radius:50%;background:#80efb4;box-shadow:0 0 12px #80efb4}.close{margin-left:auto;border:0;background:none;color:#84909f;font-size:19px;cursor:pointer}.message{margin:15px 0 7px;font-size:18px;line-height:1.35;font-weight:850;letter-spacing:-.025em}.sub{color:#687585;font-size:8px;line-height:1.55;letter-spacing:.1em}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 11px rgba(126,232,255,.06),0 0 30px 9px rgba(126,232,255,.95),0 0 65px rgba(126,232,255,.5)}}
@media(max-width:680px){#popup{left:14px;right:14px;bottom:16px;top:auto;width:auto;transform:translateY(15px)}#popup.open{transform:none}#label{font-size:7px}#brand{font-size:7px}}
</style>
</head>
<body>
<iframe id="site" src="/premium-home.html" title="EarthPulse homepage"></iframe>
<div id="overlay">
  <div id="cursor-glow" aria-hidden="true"></div>
  <button id="egg" aria-label="Open EarthPulse secret signal"></button>
  <div id="label">SECRET EARTH SIGNAL · CLICK</div>
  <div id="brand">MADE BY PRATYUSH &amp; CO.</div>
</div>
<div id="popup"><div class="top"><i></i> EARTHPULSE / SECRET SIGNAL <button class="close" id="close">×</button></div><div class="message" id="message"></div><div class="sub">AN OFFICIAL-ISH MESSAGE FROM PLANET EARTH. PROBABLY.</div></div>
<script>
(()=>{
const iframe=document.getElementById('site'),egg=document.getElementById('egg'),label=document.getElementById('label'),brand=document.getElementById('brand'),popup=document.getElementById('popup'),message=document.getElementById('message'),glow=document.getElementById('cursor-glow');
const messages=[
'Bro, Earth called. It says stop spinning the globe.',
'Breaking news: Earth is still mostly round. Scientists remain impressed.',
'You found the secret point. Please act like this was intentional.',
'Planet status: rotating. Human status: probably procrastinating.',
'EarthPulse detected one extremely important signal: you clicked the tiny dot.',
'Congratulations. You have officially bothered a planet.',
'No aliens here. Probably. Check Planet Pulse anyway.',
'Climate data loading… snacks are not included in the API.',
'The globe knows what you did. It has excellent long-term memory.',
'NASA did not send this message. Pratyush probably did.',
'Gravity is working normally. Please continue pretending this is science.',
'Earth says: nice click. Now go explore something actually scientific.'
];
let targetX=innerWidth/2,targetY=innerHeight/2,currentX=targetX,currentY=targetY;
const finePointer=matchMedia('(pointer:fine)').matches;
function moveCursor(e){targetX=e.clientX;targetY=e.clientY;glow.style.opacity='1'}
function leaveCursor(){glow.style.opacity='0'}
function bindCursor(){
 if(!finePointer)return;
 addEventListener('mousemove',moveCursor,{passive:true});
 addEventListener('mouseleave',leaveCursor,{passive:true});
 document.querySelectorAll('a,button').forEach(el=>{
  if(el.dataset.cursorGlowBound==='1')return;
  el.dataset.cursorGlowBound='1';
  el.addEventListener('mouseenter',()=>{glow.style.width='250px';glow.style.height='250px'},{passive:true});
  el.addEventListener('mouseleave',()=>{glow.style.width='190px';glow.style.height='190px'},{passive:true});
 });
 const frame=()=>{currentX+=(targetX-currentX)*.13;currentY+=(targetY-currentY)*.13;glow.style.transform=`translate3d(${currentX}px,${currentY}px,0)`;requestAnimationFrame(frame)};
 frame();
}
function locate(){
 try{
  const doc=iframe.contentDocument||iframe.contentWindow.document;
  const canvas=doc.getElementById('heroGlobe');
  const frame=doc.querySelector('.globe-frame');
  if(!canvas||!frame)return;
  const r=canvas.getBoundingClientRect();
  const fr=frame.getBoundingClientRect();
  const x=r.left+r.width*.58;
  const y=r.top+r.height*.34;
  egg.style.left=x+'px';egg.style.top=y+'px';
  label.style.left=x+'px';label.style.top=y+'px';
  brand.style.left=(fr.left+fr.width/2)+'px';brand.style.top=(fr.bottom-48)+'px';
 }catch(e){}
}
function show(){message.textContent=messages[Math.floor(Math.random()*messages.length)];popup.classList.add('open')}
iframe.addEventListener('load',()=>{locate();bindCursor();setTimeout(locate,250);setTimeout(locate,1000)});
bindCursor();
egg.addEventListener('click',show);document.getElementById('close').addEventListener('click',()=>popup.classList.remove('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')popup.classList.remove('open')});
window.addEventListener('resize',locate);window.addEventListener('scroll',locate,{passive:true});setInterval(locate,500);
})();
</script>
</body>
</html>
