<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarthPulse — Earth Intelligence</title>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9514904833890236" crossorigin="anonymous"></script>

  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;font-family:Inter,system-ui,sans-serif}
    #app{position:fixed;inset:0}
    iframe{width:100%;height:100%;border:0;display:block}
    #ai-open{position:fixed;right:22px;bottom:22px;z-index:20;border:1px solid rgba(96,165,250,.45);background:linear-gradient(135deg,#0f172a,#172554);color:#fff;border-radius:999px;padding:13px 18px;font-weight:700;font-size:14px;box-shadow:0 10px 35px rgba(0,0,0,.45);cursor:pointer}
    #ai-panel{display:none;position:fixed;right:22px;bottom:78px;z-index:21;width:min(390px,calc(100vw - 28px));height:min(600px,calc(100vh - 105px));background:rgba(2,6,23,.97);border:1px solid rgba(96,165,250,.35);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;color:#e5e7eb}
    #ai-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(148,163,184,.16);background:rgba(15,23,42,.9)}
    #ai-head b{font-size:15px} #ai-close{border:0;background:transparent;color:#94a3b8;font-size:22px;cursor:pointer}
    #ai-messages{height:calc(100% - 122px);overflow:auto;padding:14px}
    .msg{max-width:88%;padding:10px 12px;border-radius:13px;margin:0 0 10px;white-space:pre-wrap;line-height:1.45;font-size:13px}
    .bot{background:#0f172a;border:1px solid rgba(148,163,184,.13);margin-right:auto}.user{background:#1d4ed8;margin-left:auto}
    .error{background:#3f1219;border:1px solid rgba(248,113,113,.3)}
    #ai-form{height:64px;display:flex;gap:8px;padding:10px;border-top:1px solid rgba(148,163,184,.16);box-sizing:border-box}
    #ai-input{min-width:0;flex:1;border:1px solid #334155;border-radius:11px;background:#0f172a;color:#fff;padding:10px 12px;outline:none}
    #ai-send{border:0;border-radius:11px;background:#2563eb;color:#fff;padding:0 15px;font-weight:700;cursor:pointer}.busy{opacity:.6;pointer-events:none}
    @media(max-width:600px){#ai-open{right:14px;bottom:14px}#ai-panel{right:10px;bottom:70px;width:calc(100vw - 20px);height:calc(100vh - 90px)}}
  </style>
</head>
<body>
  <div id="app"><iframe id="earthpulse-frame" src="/index.html.html" title="EarthPulse"></iframe></div>
  <button id="ai-open" aria-label="Open EarthPulse AI">✦ EarthPulse AI</button>
  <section id="ai-panel" aria-label="EarthPulse AI assistant">
    <header id="ai-head"><b>✦ EARTHPULSE AI</b><button id="ai-close" aria-label="Close">×</button></header>
    <div id="ai-messages"></div>
    <form id="ai-form"><input id="ai-input" autocomplete="off" placeholder="Ask about Earth, climate, storms…"><button id="ai-send" type="submit">Send</button></form>
  </section>
  <script>
    const earthFrame=document.getElementById('earthpulse-frame');
    earthFrame.addEventListener('load',()=>{
      try{
        const doc=earthFrame.contentDocument;
        if(doc && doc.head){
          // Remove AMP Auto Ads if it was previously inserted into the embedded page.
          doc.querySelectorAll('amp-auto-ads').forEach(el=>el.remove());
          doc.querySelectorAll('script[src*="cdn.ampproject.org/v0/amp-auto-ads"]').forEach(el=>el.remove());
        }
      }catch(_){/* same-origin expected on EarthPulse */}
    });

    const openBtn=document.getElementById('ai-open'),panel=document.getElementById('ai-panel'),closeBtn=document.getElementById('ai-close'),messagesEl=document.getElementById('ai-messages'),form=document.getElementById('ai-form'),input=document.getElementById('ai-input'),send=document.getElementById('ai-send');
    const messages=[{role:'assistant',content:'I’m EarthPulse AI. Ask me about Earth science, climate, storms, earthquakes, solar activity, air quality, oceans, or how to interpret EarthPulse data.'}];
    function addMessage(content,role='assistant',extra=''){messages.push({role,content,extra})}
    function render(){messagesEl.innerHTML='';messages.forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot')+(m.extra?' '+m.extra:'');d.textContent=m.content;messagesEl.appendChild(d)});messagesEl.scrollTop=messagesEl.scrollHeight}
    function toggle(v){panel.style.display=v?'block':'none';if(v){input.focus();render()}}
    openBtn.onclick=()=>toggle(true);closeBtn.onclick=()=>toggle(false);render();
    form.onsubmit=async e=>{
      e.preventDefault();
      const text=input.value.trim();
      if(!text)return;
      addMessage(text,'user');input.value='';render();send.classList.add('busy');send.textContent='…';
      try{
        const r=await fetch('/api/earthpulse-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>({role:m.role,content:m.content})),context:{currentPage:'EarthPulse dashboard',note:'This assistant is embedded in the EarthPulse dashboard. Only use data explicitly supplied in context; if live values are unavailable, say so.'}})});
        let d={};try{d=await r.json()}catch(_){d={message:'The AI backend returned a non-JSON response.'}}
        if(!r.ok)throw new Error(d.message||('AI backend returned HTTP '+r.status+'.'));
        addMessage(d.text||'The AI backend returned an empty answer.','assistant',d.text?'':'error');
      }catch(err){addMessage('AI ERROR: '+(err?.message||'Unknown error'),'assistant','error')}
      finally{send.classList.remove('busy');send.textContent='Send';render()}
    };
  </script>
</body>
</html>
