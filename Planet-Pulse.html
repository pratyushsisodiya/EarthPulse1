/* ============================== HELPERS ============================== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * D2R, dLon = (lon2 - lon1) * D2R;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * D2R) * Math.cos(lat2 * D2R) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function bearingDeg(lat1, lon1, lat2, lon2) {
  const y = Math.sin((lon2 - lon1) * D2R) * Math.cos(lat2 * D2R);
  const x = Math.cos(lat1 * D2R) * Math.sin(lat2 * D2R) - Math.sin(lat1 * D2R) * Math.cos(lat2 * D2R) * Math.cos((lon2 - lon1) * D2R);
  return (Math.atan2(y, x) * R2D + 360) % 360;
}
function fmtAgo(iso) {
  if (!iso) return "—";
  const diffMs = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diffMs / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}
function fmtDT(iso) {
  if (!iso) return "—";
  return new Date(iso).toISOString().replace("T", " ").slice(0, 16) + " UTC";
}
function isoDaysAgo(days) { return new Date(Date.now() - days * 86400000).toISOString(); }

// Approximate subsolar point (good enough for a visual day/night indicator; not astronomically precise).
function subsolarPoint(date) {
  const start = Date.UTC(date.getUTCFullYear(), 0, 1);
  const dayOfYear = Math.floor((date.getTime() - start) / 86400000);
  const decl = 23.44 * Math.sin(D2R * (360 / 365) * (dayOfYear - 81));
  const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60;
  let lon = 180 - utcHours * 15;
  if (lon > 180) lon -= 360;
  if (lon < -180) lon += 360;
  return { lat: decl, lon };
}

const api = {
  async fetchQuakes({ startISO, endISO, minMag = 2.5, limit = 500 }) {
    const params = new URLSearchParams({
      format: "geojson", starttime: startISO.slice(0, 10), endtime: endISO.slice(0, 10),
      minmagnitude: String(minMag), orderby: "time", limit: String(limit)
    });
    const res = await fetch(`https://earthquake.usgs.gov/fdsnws/event/1/query?${params}`, { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error("USGS_UNAVAILABLE");
    const geo = await res.json();
    return geo.features.map(f => ({
      id: f.id,
      magnitude: f.properties.mag,
      location: f.properties.place || "Unknown location",
      timestamp: new Date(f.properties.time).toISOString(),
      latitude: f.geometry.coordinates[1],
      longitude: f.geometry.coordinates[0],
      depthKm: f.geometry.coordinates[2],
      tsunami: f.properties.tsunami === 1,
      url: f.properties.url,
      source: "USGS"
    })).filter(e => typeof e.magnitude === "number" && typeof e.latitude === "number");
  },
  async fetchPlates() {
    if (platesCache) return platesCache;
    try {
      const res = await fetch("https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.geojson", { signal: AbortSignal.timeout(12000) });
      if (!res.ok) throw new Error("PLATES_UNAVAILABLE");
      const geo = await res.json();
      const lines = [];
      geo.features.forEach(f => {
        const coordArrays = f.geometry.type === "MultiLineString" ? f.geometry.coordinates : [f.geometry.coordinates];
        coordArrays.forEach(coords => lines.push(coords.map(([lon, lat]) => ({ lat, lon }))));
      });
      platesCache = lines;
      return lines;
    } catch (e) {
      platesCache = null;
      throw e;
    }
  },
  async fetchSolar() {
    try {
      const res = await fetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json", { signal: AbortSignal.timeout(8000) });
      if (!res.ok) throw new Error("NOAA_UNAVAILABLE");
      const rows = (await res.json()).slice(1);
      const last = rows[rows.length - 1];
      return { available: true, kp: last ? parseFloat(last[1]) : null, timestamp: last ? last[0] : null };
    } catch (e) {
      return { available: false };
    }
  },
  async fetchWeatherAQI(lat, lon) {
    const [wRes, aRes] = await Promise.allSettled([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,pressure_msl&timezone=auto`, { signal: AbortSignal.timeout(8000) }),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm2_5`, { signal: AbortSignal.timeout(8000) })
    ]);
    let weather = null, aqi = null;
    if (wRes.status === "fulfilled" && wRes.value.ok) { const d = await wRes.value.json(); weather = d.current; }
    if (aRes.status === "fulfilled" && aRes.value.ok) { const d = await aRes.value.json(); aqi = d.current; }
    return { weather, aqi, available: !!(weather || aqi) };
  },
  async geocode(q) {
    if (!q || q.trim().length < 2) return [];
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5`, { signal: AbortSignal.timeout(8000) });
      if (!res.ok) return [];
      const d = await res.json();
      return (d.results || []).map(r => ({ name: r.name, country: r.country || "", lat: r.latitude, lon: r.longitude }));
    } catch (e) { return []; }
  }
};

/* Derived (labeled) analytics — computed client-side from the fetched events above. */
function buildPulseGrid(events, cellDeg = 12) {
  const grid = {};
  events.forEach(e => {
    const gLat = Math.floor(e.latitude / cellDeg) * cellDeg + cellDeg / 2;
    const gLon = Math.floor(e.longitude / cellDeg) * cellDeg + cellDeg / 2;
    const key = `${gLat}_${gLon}`;
    if (!grid[key]) grid[key] = { lat: gLat, lon: gLon, count: 0, weight: 0 };
    grid[key].count++;
    grid[key].weight += Math.max(1, e.magnitude);
  });
  const cells = Object.values(grid);
  const maxW = Math.max(...cells.map(c => c.weight), 1);
  return cells.map(c => ({ ...c, intensity: c.weight / maxW }));
}
function findRelated(event, allEvents, kmThresh = 400, hrThresh = 72) {
  if (!event) return [];
  const t0 = new Date(event.timestamp).getTime();
  return allEvents
    .filter(e => e.id !== event.id)
    .map(e => ({ event: e, km: haversineKm(event.latitude, event.longitude, e.latitude, e.longitude), hrs: Math.abs(new Date(e.timestamp).getTime() - t0) / 3600000 }))
    .filter(r => r.km <= kmThresh && r.hrs <= hrThresh)
    .sort((a, b) => a.km - b.km)
    .slice(0, 8);
}
function matchesRegion(e, box) {
  const latOk = e.latitude >= box.latMin && e.latitude <= box.latMax;
  const lonOk = box.wrap ? (e.longitude >= box.lonMin || e.longitude <= box.lonMax) : (e.longitude >= box.lonMin && e.longitude <= box.lonMax);
  return latOk && lonOk;
}
function parseSearchQuery(q) {
  const lower = q.toLowerCase();
  const filters = { minMag: null, regionKey: null, regionLabel: null, days: null };
  const magMatch = lower.match(/(?:magnitude|mag|m)\s*(?:above|over|>|of)?\s*(\d(?:\.\d)?)/);
  if (magMatch) filters.minMag = parseFloat(magMatch[1]);
  for (const key of Object.keys(REGION_BOXES)) {
    if (lower.includes(key)) { filters.regionKey = key; filters.regionLabel = key.replace(/\b\w/g, c => c.toUpperCase()); break; }
  }
  if (lower.includes("today")) filters.days = 1;
  else if (lower.includes("week")) filters.days = 7;
  else if (lower.includes("month")) filters.days = 30;
  else { const dMatch = lower.match(/last\s+(\d+)\s+day/); if (dMatch) filters.days = parseInt(dMatch[1], 10); }
  return filters;
}

/* ============================== SOUND (never autoplays) ============================== */
function useSound() {
  const ctxRef = useRef(null);
  const play = useCallback((type, enabled) => {
    if (!enabled) return;
    try {
      if (!ctxRef.current) ctxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = ctxRef.current;
      const freqs = { select: [620], toggle: [420], complete: [660, 880], alert: [280] }[type] || [500];
      let t = ctx.currentTime;
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.frequency.value = f; osc.type = "sine";
        gain.gain.setValueAtTime(0.06, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.13);
        t += 0.09;
      });
    } catch (e) {}
  }, []);
  return play;
}

/* ============================== 3D PLANET ============================== */
const Planet3D = ({ events, plates, platesStatus, layers, selectedEvent, onSelectEvent, pulseGrid, related, subsolar, focusRequest, onFocusHandled }) => {
  const mountRef = useRef(null);
  const stateRef = useRef({});

  useEffect(() => {
    const el = mountRef.current;
    const width = el.clientWidth, height = el.clientHeight;
    const THREE_ = window.THREE;
    const scene = new THREE_.Scene();
    const camera = new THREE_.PerspectiveCamera(45, width / height, 0.1, 2000);

    const renderer = new THREE_.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    el.innerHTML = ""; el.appendChild(renderer.domElement);

    // Stars

    const globeGroup = new THREE_.Group();
    scene.add(globeGroup);
    const R = 2.0;

    // Procedural land/ocean texture (no external image dependency / no CORS risk)
    const canvasTex = document.createElement("canvas");
    canvasTex.width = 1024; canvasTex.height = 512;
    const ctx2 = canvasTex.getContext("2d");
    ctx2.fillStyle = "#071827"; ctx2.fillRect(0, 0, 1024, 512);
    ctx2.fillStyle = "#123049"; ctx2.strokeStyle = "#1c435f"; ctx2.lineWidth = 1.5;
    const poly = (pts) => { ctx2.beginPath(); pts.forEach(([lon, lat], i) => { const x = ((lon + 180) / 360) * 1024, y = ((90 - lat) / 180) * 512; i ? ctx2.lineTo(x, y) : ctx2.moveTo(x, y); }); ctx2.closePath(); ctx2.fill(); ctx2.stroke(); };
    poly([[-170,72],[-90,72],[-70,45],[-100,25],[-125,48],[-170,60]]);
    poly([[-80,10],[-35,-5],[-58,-56],[-75,-18],[-80,10]]);
    poly([[-12,60],[35,68],[45,35],[-10,35],[-12,60]]);
    poly([[-18,35],[52,32],[45,-35],[8,-35],[-18,35]]);
    poly([[45,70],[145,72],[125,8],[62,8],[45,70]]);
    poly([[112,-8],[154,-9],[147,-43],[113,-35],[112,-8]]);
    const texture = new THREE_.CanvasTexture(canvasTex);
    const globe = new THREE_.Mesh(new THREE_.SphereGeometry(R, 64, 64), new THREE_.MeshPhongMaterial({ map: texture, specular: 0x1e3a5f, shininess: 10 }));
    globeGroup.add(globe);

    // Atmosphere
    globeGroup.add(new THREE_.Mesh(new THREE_.SphereGeometry(R * 1.045, 48, 48), new THREE_.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, side: THREE_.BackSide })));

    // Night hemisphere (approximate day/night terminator) — child of globeGroup so it stays fixed to the texture frame
    const nightMesh = new THREE_.Mesh(new THREE_.SphereGeometry(R * 1.006, 48, 48, 0, Math.PI), new THREE_.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45 }));
    globeGroup.add(nightMesh);

    // Orbital rings (aesthetic + "instrument" feel)
    [1.5, 1.85].forEach((mult, i) => {
      const ring = new THREE_.Mesh(new THREE_.TorusGeometry(R * mult, 0.004, 8, 128), new THREE_.MeshBasicMaterial({ color: i === 0 ? 0x38bdf8 : 0x8b5cf6, transparent: true, opacity: 0.35 }));
      ring.rotation.x = Math.PI / 2 + i * 0.35;
      scene.add(ring);
    });

    // Grid
    const gridGroup = new THREE_.Group();
    const gridMat = new THREE_.LineBasicMaterial({ color: 0x2c5c82, transparent: true, opacity: 0.4 });
    for (let lat = -60; lat <= 60; lat += 30) {
      const pts = []; for (let lon = 0; lon <= 360; lon += 4) pts.push(latLonToVec3(lat, lon - 180, R * 1.003));
      gridGroup.add(new THREE_.LineLoop(new THREE_.BufferGeometry().setFromPoints(pts), gridMat));
    }
    for (let lon = -150; lon <= 180; lon += 30) {
      const pts = []; for (let lat = -90; lat <= 90; lat += 4) pts.push(latLonToVec3(lat, lon, R * 1.003));
      gridGroup.add(new THREE_.Line(new THREE_.BufferGeometry().setFromPoints(pts), gridMat));
    }
    globeGroup.add(gridGroup);

    const platesGroup = new THREE_.Group(); globeGroup.add(platesGroup);
    const markersGroup = new THREE_.Group(); globeGroup.add(markersGroup);
    const pulseGroup = new THREE_.Group(); globeGroup.add(pulseGroup);
    const linksGroup = new THREE_.Group(); globeGroup.add(linksGroup);

    scene.add(new THREE_.AmbientLight(0xffffff, 0.75));
    const dl = new THREE_.DirectionalLight(0xffffff, 1.05); dl.position.set(5, 3, 5); scene.add(dl);

    function latLonToVec3(lat, lon, radius) {
      const phi = (90 - lat) * D2R, theta = (lon + 180) * D2R;
      return new THREE_.Vector3(-radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
    }

    // Interaction: drag rotate, wheel/pinch zoom, raycast click
    let dragging = false, lastX = 0, lastY = 0, autoRotate = true;
    const raycaster = new THREE_.Raycaster(); raycaster.params.Points.threshold = 0.06;
    const pointer = new THREE_.Vector2();
    const dom = renderer.domElement;
    const onDown = (x, y) => { dragging = true; autoRotate = false; lastX = x; lastY = y; };
    const onMove = (x, y) => { if (!dragging) return; globeGroup.rotation.y += (x - lastX) * 0.005; globeGroup.rotation.x = Math.max(-1.2, Math.min(1.2, globeGroup.rotation.x + (y - lastY) * 0.005)); lastX = x; lastY = y; };
    const onUp = () => { dragging = false; };
    dom.addEventListener("mousedown", e => onDown(e.clientX, e.clientY));
    window.addEventListener("mousemove", e => onMove(e.clientX, e.clientY));
    window.addEventListener("mouseup", onUp);
    dom.addEventListener("touchstart", e => { if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    dom.addEventListener("touchmove", e => { if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
    dom.addEventListener("touchend", onUp);
    let pinchD = null;
    dom.addEventListener("touchstart", e => { if (e.touches.length === 2) pinchD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
    dom.addEventListener("touchmove", e => { if (e.touches.length === 2) { const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); if (pinchD) camera.position.z = Math.max(2.9, Math.min(12, camera.position.z - (d - pinchD) * 0.01)); pinchD = d; } }, { passive: true });
    dom.addEventListener("wheel", e => { e.preventDefault(); camera.position.z = Math.max(2.9, Math.min(12, camera.position.z + e.deltaY * 0.004)); }, { passive: false });
    dom.addEventListener("click", e => {
      const rect = dom.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(markersGroup.children);
      if (hits.length) stateRef.current.onSelect && stateRef.current.onSelect(hits[0].object.userData.event);
    });

    let flyTo = null, reqId;
    function animate() {
      reqId = requestAnimationFrame(animate);
      if (autoRotate && !flyTo) globeGroup.rotation.y += 0.0009;
      if (flyTo) {
        flyTo.t += 0.02;
        globeGroup.rotation.y = THREE_.MathUtils.lerp(flyTo.fromY, flyTo.toY, Math.min(1, flyTo.t));
        globeGroup.rotation.x = THREE_.MathUtils.lerp(flyTo.fromX, flyTo.toX, Math.min(1, flyTo.t));
        camera.position.z = THREE_.MathUtils.lerp(flyTo.fromZ, flyTo.toZ, Math.min(1, flyTo.t));
        if (flyTo.t >= 1) { flyTo = null; stateRef.current.onFocusHandled && stateRef.current.onFocusHandled(); }
      }
      linksGroup.children.forEach(l => { l.material.opacity = 0.35 + Math.sin(Date.now() * 0.004) * 0.15; });
      renderer.render(scene, camera);
    }
    animate();

    function onResize() { const w = el.clientWidth, h = el.clientHeight; if (!w || !h) return; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }
    window.addEventListener("resize", onResize);

    stateRef.current = {
      ...stateRef.current, scene, camera, renderer, globeGroup, markersGroup, platesGroup, pulseGroup, linksGroup, gridGroup, nightMesh,
      latLonToVec3, R,
      setFlyTo: (lat, lon) => {
        const targetLon = -lon; // rotate globe so target faces camera
        flyTo = { t: 0, fromY: globeGroup.rotation.y, toY: (targetLon) * D2R, fromX: globeGroup.rotation.x, toX: (-lat * 0.5) * D2R, fromZ: camera.position.z, toZ: 3.6 };
      }
    };

    return () => {
      cancelAnimationFrame(reqId);
      window.removeEventListener("resize", onResize);
      renderer.dispose();
    };
  }, []);

  // wire callbacks each render without re-init
  useEffect(() => { stateRef.current.onSelect = onSelectEvent; stateRef.current.onFocusHandled = onFocusHandled; });

  // markers
  useEffect(() => {
    const s = stateRef.current; if (!s.markersGroup) return;
    while (s.markersGroup.children.length) s.markersGroup.remove(s.markersGroup.children[0]);
    if (!layers.earthquakes) return;
    events.forEach(e => {
      const size = 0.012 + Math.max(0, e.magnitude) * 0.006;
      const color = e.magnitude >= 6 ? 0xef4444 : e.magnitude >= 4.5 ? 0xf59e0b : 0x38bdf8;
      const m = new window.THREE.Mesh(new window.THREE.SphereGeometry(size, 10, 10), new window.THREE.MeshBasicMaterial({ color }));
      m.position.copy(s.latLonToVec3(e.latitude, e.longitude, s.R * 1.015));
      m.userData = { event: e };
      s.markersGroup.add(m);
      if (selectedEvent && e.id === selectedEvent.id) {
        const ring = new window.THREE.Mesh(new window.THREE.RingGeometry(size * 2.2, size * 3, 24), new window.THREE.MeshBasicMaterial({ color: 0xffffff, side: window.THREE.DoubleSide, transparent: true, opacity: 0.8 }));
        ring.position.copy(m.position); ring.lookAt(0, 0, 0);
        s.markersGroup.add(ring);
      }
    });
  }, [events, layers.earthquakes, selectedEvent]);

  // plates
  useEffect(() => {
    const s = stateRef.current; if (!s.platesGroup) return;
    while (s.platesGroup.children.length) s.platesGroup.remove(s.platesGroup.children[0]);
    if (!layers.plates || platesStatus !== "ok" || !plates) return;
    plates.forEach(line => {
      const pts = line.map(p => s.latLonToVec3(p.lat, p.lon, s.R * 1.008));
      s.platesGroup.add(new window.THREE.Line(new window.THREE.BufferGeometry().setFromPoints(pts), new window.THREE.LineBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.55 })));
    });
  }, [plates, platesStatus, layers.plates]);

  // pulse (derived)
  useEffect(() => {
    const s = stateRef.current; if (!s.pulseGroup) return;
    while (s.pulseGroup.children.length) s.pulseGroup.remove(s.pulseGroup.children[0]);
    if (!layers.pulse || !pulseGrid) return;
    pulseGrid.forEach(c => {
      const size = 0.05 + c.intensity * 0.22;
      const color = new window.THREE.Color().setHSL(0.55 - c.intensity * 0.55, 0.9, 0.5);
      const m = new window.THREE.Mesh(new window.THREE.CircleGeometry(size, 16), new window.THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 + c.intensity * 0.35, side: window.THREE.DoubleSide }));
      const pos = s.latLonToVec3(c.lat, c.lon, s.R * 1.012);
      m.position.copy(pos); m.lookAt(0, 0, 0);
      s.pulseGroup.add(m);
    });
  }, [pulseGrid, layers.pulse]);

  // constellations
  useEffect(() => {
    const s = stateRef.current; if (!s.linksGroup) return;
    while (s.linksGroup.children.length) s.linksGroup.remove(s.linksGroup.children[0]);
    if (!selectedEvent || !related || !related.length) return;
    related.forEach(r => {
      const a = s.latLonToVec3(selectedEvent.latitude, selectedEvent.longitude, s.R * 1.02);
      const b = s.latLonToVec3(r.event.latitude, r.event.longitude, s.R * 1.02);
      const mid = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(s.R * 1.15);
      const curve = new window.THREE.QuadraticBezierCurve3(a, mid, b);
      const pts = curve.getPoints(20);
      const line = new window.THREE.Line(new window.THREE.BufferGeometry().setFromPoints(pts), new window.THREE.LineBasicMaterial({ color: 0xa855f7, transparent: true, opacity: 0.5 }));
      s.linksGroup.add(line);
    });
  }, [selectedEvent, related]);

  // day/night + grid toggle
  useEffect(() => {
    const s = stateRef.current; if (!s.nightMesh) return;
    s.nightMesh.visible = !!layers.daynight;
    if (subsolar) s.nightMesh.rotation.y = -(subsolar.lon) * D2R + Math.PI / 2;
  }, [layers.daynight, subsolar]);
  useEffect(() => { const s = stateRef.current; if (s.gridGroup) s.gridGroup.visible = !!layers.grid; }, [layers.grid]);

  // fly-to on focus request
  useEffect(() => {
    const s = stateRef.current;
    if (focusRequest && s.setFlyTo) s.setFlyTo(focusRequest.lat, focusRequest.lon);
  }, [focusRequest]);

  return <div ref={mountRef} className="w-full h-full cursor-grab active:cursor-grabbing" role="img" aria-label="Interactive 3D globe showing planetary events" />;
};

/* ============================== CROSS SECTION ============================== */
const CrossSection = ({ event }) => {
  if (!event) return <div className="text-xs text-slate-500 mono py-6 text-center">Select an event to see its depth cross-section.</div>;
  const RE = 6371;
  const layersDef = [
    { name: "Crust", outer: RE, inner: RE - 35, color: "#38bdf8" },
    { name: "Upper Mantle", outer: RE - 35, inner: RE - 660, color: "#0ea5e9" },
    { name: "Lower Mantle", outer: RE - 660, inner: RE - 2890, color: "#7c3aed" },
    { name: "Outer Core", outer: RE - 2890, inner: RE - 5150, color: "#f59e0b" },
    { name: "Inner Core", outer: RE - 5150, inner: 0, color: "#ef4444" }
  ];
  const cx = 110, cy = 110, maxR = 100;
  const scale = r => (r / RE) * maxR;
  const eventR = scale(RE - Math.max(0, event.depthKm || 0));
  const ang = -Math.PI / 2;
  return (
    <div className="flex flex-col items-center gap-2">
      <svg viewBox="0 0 220 220" className="w-44 h-44">
        {layersDef.map((L, i) => <circle key={i} cx={cx} cy={cy} r={scale(L.outer)} fill={L.color} opacity={0.85 - i * 0.08} />)}
        <line x1={cx} y1={cy} x2={cx + maxR * Math.cos(ang)} y2={cy + maxR * Math.sin(ang)} stroke="#475569" strokeDasharray="2 2" strokeWidth="1" />
        <circle cx={cx + eventR * Math.cos(ang)} cy={cy + eventR * Math.sin(ang)} r="4" fill="#fff" stroke="#020617" strokeWidth="1.5" />
      </svg>
      <div className="mono text-[10px] text-slate-400 text-center leading-relaxed">
        Event depth: <span className="text-white font-bold">{(event.depthKm || 0).toFixed(1)} km</span> below surface<br />
        (proportional to Earth's true radius of {RE.toLocaleString()} km)
      </div>
      <div className="grid grid-cols-1 gap-0.5 text-[9px] mono w-full">
        {layersDef.map((L, i) => <div key={i} className="flex justify-between text-slate-500"><span style={{ color: L.color }}>■ {L.name}</span><span>{L.inner}–{L.outer} km</span></div>)}
      </div>
    </div>
  );
};

/* ============================== EVENT RADAR ============================== */
const EventRadar = ({ referenceEvent, events }) => {
  if (!referenceEvent) return <div className="text-xs text-slate-500 mono py-6 text-center">Select an event to activate the radar.</div>;
  const rings = [{ label: "LOCAL", km: 500 }, { label: "REGIONAL", km: 2000 }, { label: "HEMISPHERE", km: 10000 }, { label: "GLOBAL", km: 20037 }];
  const cx = 110, cy = 110, maxR = 100;
  const pts = events.filter(e => e.id !== referenceEvent.id).slice(0, 80).map(e => {
    const km = haversineKm(referenceEvent.latitude, referenceEvent.longitude, e.latitude, e.longitude);
    const bear = bearingDeg(referenceEvent.latitude, referenceEvent.longitude, e.latitude, e.longitude);
    const r = Math.min(maxR, (Math.log10(km + 1) / Math.log10(20038)) * maxR);
    const ang = (bear - 90) * D2R;
    return { x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang), mag: e.magnitude };
  });
  return (
    <svg viewBox="0 0 220 220" className="w-full max-w-[220px] mx-auto">
      {rings.map((r, i) => <circle key={i} cx={cx} cy={cy} r={(i + 1) * (maxR / rings.length)} fill="none" stroke="#1e3a5f" strokeWidth="1" />)}
      <line x1={cx} y1={10} x2={cx} y2={210} stroke="#1e3a5f" strokeWidth="1" />
      <line x1={10} y1={cy} x2={210} y2={cy} stroke="#1e3a5f" strokeWidth="1" />
      {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={Math.max(1.5, p.mag * 0.9)} fill={p.mag >= 5 ? "#ef4444" : "#38bdf8"} opacity="0.85" />)}
      <circle cx={cx} cy={cy} r="4" fill="#fff" />
    </svg>
  );
};

/* ============================== APP ============================== */
function App() {
  const [mode, setMode] = useState("explorer");
  const [rangePreset, setRangePreset] = useState(RANGE_PRESETS[0]);
  const [events, setEvents] = useState([]);
  const [loadingEvents, setLoadingEvents] = useState(true);
  const [eventsError, setEventsError] = useState(null);
  const [plates, setPlates] = useState(null);
  const [platesStatus, setPlatesStatus] = useState("loading");
  const [solar, setSolar] = useState({ available: false });
  const [selectedEvent, setSelectedEvent] = useState(null);
  const [pinned, setPinned] = useState([]);
  const [layers, setLayers] = useState(Object.fromEntries(LAYER_DEFS.map(l => [l.id, l.available])));
  const [provenanceKey, setProvenanceKey] = useState(null);
  const [searchText, setSearchText] = useState("");
  const [searchFilters, setSearchFilters] = useState(null);
  const [playhead, setPlayhead] = useState({ playing: false, reverse: false, speed: 1, pos: 1 });
  const [soundOn, setSoundOn] = useState(false);
  const [cmdOpen, setCmdOpen] = useState(false);
  const [cmdText, setCmdText] = useState("");
  const [focusRequest, setFocusRequest] = useState(null);
  const [toast, setToastMsg] = useState(null);
  const [memoryQuery, setMemoryQuery] = useState("");
  const [memoryResult, setMemoryResult] = useState(null);
  const [memoryLoading, setMemoryLoading] = useState(false);
  const [selectedCity, setSelectedCity] = useState(null);
  const [cityData, setCityData] = useState(null);
  const [missionFlags, setMissionFlags] = useState({ foundBigQuake: false, inspectedCrossSection: false, viewedSolar: false, changedRange: false });
  const playSound = useSound();
  const globeContainerRef = useRef(null);

  const notify = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2400); };

  const loadEvents = useCallback(async (preset) => {
    setLoadingEvents(true); setEventsError(null);
    try {
      const data = await api.fetchQuakes({ startISO: isoDaysAgo(preset.days), endISO: new Date().toISOString(), minMag: preset.defaultMinMag, limit: 600 });
      setEvents(data);
      if (data.some(e => e.magnitude >= 5)) setMissionFlags(f => ({ ...f, foundBigQuake: true }));
    } catch (e) { setEventsError("USGS did not respond. Showing no data rather than guessing."); setEvents([]); }
    setLoadingEvents(false);
  }, []);

  useEffect(() => { loadEvents(rangePreset); }, []);
  useEffect(() => {
    api.fetchPlates().then(d => { setPlates(d); setPlatesStatus("ok"); }).catch(() => setPlatesStatus("unavailable"));
    api.fetchSolar().then(setSolar);
    const iv = setInterval(() => api.fetchSolar().then(setSolar), 5 * 60000);
    return () => clearInterval(iv);
  }, []);

  const filteredEvents = useMemo(() => {
    let list = events;
    if (searchFilters) {
      if (searchFilters.minMag != null) list = list.filter(e => e.magnitude >= searchFilters.minMag);
      if (searchFilters.regionKey) list = list.filter(e => matchesRegion(e, REGION_BOXES[searchFilters.regionKey]));
      if (searchFilters.days) { const cutoff = Date.now() - searchFilters.days * 86400000; list = list.filter(e => new Date(e.timestamp).getTime() >= cutoff); }
    }
    return list;
  }, [events, searchFilters]);

  // Time machine: playhead filters the loaded set by chronological position
  const timeSpan = useMemo(() => {
    if (!filteredEvents.length) return null;
    const times = filteredEvents.map(e => new Date(e.timestamp).getTime());
    return { min: Math.min(...times), max: Math.max(...times) };
  }, [filteredEvents]);
  const visibleEvents = useMemo(() => {
    if (mode !== "timemachine" || !timeSpan) return filteredEvents;
    const cutoff = timeSpan.min + (timeSpan.max - timeSpan.min) * playhead.pos;
    return filteredEvents.filter(e => new Date(e.timestamp).getTime() <= cutoff);
  }, [filteredEvents, mode, timeSpan, playhead.pos]);

  useEffect(() => {
    if (!playhead.playing || !timeSpan) return;
    const iv = setInterval(() => {
      setPlayhead(p => {
        let next = p.pos + (p.reverse ? -1 : 1) * 0.01 * p.speed;
        if (next >= 1) { next = 1; return { ...p, pos: next, playing: false }; }
        if (next <= 0) { next = 0; return { ...p, pos: next, playing: false }; }
        return { ...p, pos: next };
      });
    }, 100);
    return () => clearInterval(iv);
  }, [playhead.playing, playhead.reverse, playhead.speed, timeSpan]);

  const pulseGrid = useMemo(() => buildPulseGrid(visibleEvents), [visibleEvents]);
  const related = useMemo(() => findRelated(selectedEvent, filteredEvents), [selectedEvent, filteredEvents]);
  const subsolar = useMemo(() => subsolarPoint(new Date()), []);

  const handleSelect = useCallback((e) => { setSelectedEvent(e); playSound("select", soundOn); }, [soundOn]);
  const handleFocus = useCallback((e) => { setSelectedEvent(e); setFocusRequest({ lat: e.latitude, lon: e.longitude, _t: Date.now() }); playSound("select", soundOn); }, [soundOn]);

  const runSearch = () => {
    const f = parseSearchQuery(searchText);
    setSearchFilters(f.minMag || f.regionKey || f.days ? f : null);
  };

  const runMemory = async () => {
    const hits = await api.geocode(memoryQuery);
    if (!hits.length) { setMemoryResult({ error: "Location not found." }); return; }
    const loc = hits[0];
    setMemoryLoading(true);
    try {
      const hist = await api.fetchQuakes({ startISO: isoDaysAgo(365 * 3), endISO: new Date().toISOString(), minMag: 3.0, limit: 600 });
      const box = { latMin: loc.lat - 3, latMax: loc.lat + 3, lonMin: loc.lon - 3, lonMax: loc.lon + 3 };
      const regional = hist.filter(e => matchesRegion(e, box));
      const recent30 = regional.filter(e => new Date(e.timestamp).getTime() >= Date.now() - 30 * 86400000);
      const monthlyAvg = regional.length / ((3 * 365) / 30);
      setMemoryResult({ loc, total: regional.length, maxMag: regional.length ? Math.max(...regional.map(e => e.magnitude)) : null, mostRecent: regional[0] || null, recent30: recent30.length, monthlyAvg: monthlyAvg.toFixed(1) });
    } catch (e) { setMemoryResult({ error: "USGS query failed for this region." }); }
    setMemoryLoading(false);
  };

  const selectCity = async (loc) => {
    setSelectedCity(loc);
    const d = await api.fetchWeatherAQI(loc.lat, loc.lon);
    setCityData(d);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") { e.preventDefault(); setCmdOpen(true); }
      if (e.key === "Escape") { setCmdOpen(false); setProvenanceKey(null); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const runCommand = (cmd) => {
    setCmdOpen(false); setCmdText("");
    if (cmd === "solar") { setMissionFlags(f => ({ ...f, viewedSolar: true })); document.getElementById("state-strip")?.scrollIntoView({ behavior: "smooth" }); return; }
    if (cmd === "air" || cmd === "climate") { document.getElementById("planetary-memory")?.scrollIntoView({ behavior: "smooth" }); return; }
    if (cmd === "time") { setMode("timemachine"); return; }
    if (cmd === "search") { document.getElementById("search-input")?.focus(); return; }
    if (cmd === "compare") { setMode("compare"); return; }
    if (cmd === "orbit") { setMode("global"); return; }
    if (cmd === "fullscreen") { globeContainerRef.current?.requestFullscreen?.().catch(() => notify("Fullscreen unavailable")); return; }
    if (cmd === "sources") { document.getElementById("layer-panel")?.scrollIntoView({ behavior: "smooth" }); return; }
    if (cmd === "earthquake") { setMode("explorer"); return; }
  };

  const COMMANDS = ["earthquake", "solar", "air", "climate", "time", "search", "compare", "orbit", "fullscreen", "sources"];
  const filteredCommands = COMMANDS.filter(c => c.includes(cmdText.toLowerCase()));

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100 antialiased">
      {/* HEADER */}
      <header className="sticky top-0 z-40 h-14 glass flex items-center px-4 gap-3">
        <div className="flex items-center gap-2 font-extrabold tracking-wide mono text-sm">
          <Icon name="globe" className="w-5 h-5 text-cyan-400" /> PLANET<span className="text-cyan-400">PULSE</span>
        </div>
        <span className="hidden sm:inline text-[10px] mono px-2 py-0.5 rounded border border-slate-700 text-slate-400">EarthPulse Planetary Intelligence</span>
        <div className="ml-auto flex items-center gap-1.5 flex-wrap justify-end">
          {["explorer", "analyst", "timemachine", "compare", "mission", "global"].map(m => (
            <button key={m} onClick={() => setMode(m)} className={`px-2.5 py-1.5 rounded-md text-[10px] mono font-bold uppercase tracking-wide border transition-colors ${mode === m ? "bg-cyan-500/15 border-cyan-500/50 text-cyan-300" : "border-slate-800 text-slate-400 hover:text-slate-200"}`}>{m}</button>
          ))}
          <button onClick={() => setSoundOn(v => !v)} title={soundOn ? "Mute" : "Unmute"} className="p-1.5 rounded-md border border-slate-800 text-slate-400 hover:text-white"><Icon name={soundOn ? "volume" : "mute"} className="w-3.5 h-3.5" /></button>
          <button onClick={() => setCmdOpen(true)} title="Command palette ( / )" className="p-1.5 rounded-md border border-slate-800 text-slate-400 hover:text-white"><Icon name="command" className="w-3.5 h-3.5" /></button>
        </div>
      </header>

      <div className="max-w-[1500px] mx-auto p-3 lg:p-5 space-y-5">
        {eventsError && <div className="glass rounded-lg px-4 py-2.5 text-xs mono text-amber-300 flex items-center gap-2"><Icon name="warning" className="w-4 h-4" />{eventsError}</div>}

        {/* TIME MACHINE */}
        <section className="glass rounded-xl p-3">
          <div className="flex flex-wrap items-center gap-2 mono text-xs">
            <Icon name="clock" className="w-4 h-4 text-cyan-400" />
            <span className="font-bold uppercase tracking-wider text-slate-300 mr-2">Time Machine</span>
            {RANGE_PRESETS.map(p => (
              <button key={p.id} onClick={() => { setRangePreset(p); setPlayhead({ playing: false, reverse: false, speed: 1, pos: 1 }); loadEvents(p); setMissionFlags(f => ({ ...f, changedRange: true })); }} className={`px-2 py-1 rounded border ${rangePreset.id === p.id ? "bg-cyan-500/15 border-cyan-500/50 text-cyan-300" : "border-slate-800 text-slate-400"}`}>{p.label}</button>
            ))}
            <span className="text-slate-600">min M{rangePreset.defaultMinMag} (kept low for performance)</span>
            <ProvenanceButton sourceKey="usgs" onOpen={setProvenanceKey} />
          </div>
          {mode === "timemachine" && (
            <div className="mt-3 flex items-center gap-2">
              <button onClick={() => setPlayhead(p => ({ ...p, reverse: true, playing: true }))} className="p-2 rounded bg-slate-900 border border-slate-800 text-slate-300"><Icon name="rewind" className="w-4 h-4" /></button>
              <button onClick={() => setPlayhead(p => ({ ...p, playing: !p.playing, reverse: false }))} className="p-2 rounded bg-cyan-500/15 border border-cyan-500/50 text-cyan-300"><Icon name={playhead.playing ? "pause" : "play"} className="w-4 h-4" /></button>
              <input type="range" min="0" max="1" step="0.001" value={playhead.pos} onChange={e => setPlayhead(p => ({ ...p, pos: parseFloat(e.target.value), playing: false }))} className="flex-1 accent-cyan-500" />
              <select value={playhead.speed} onChange={e => setPlayhead(p => ({ ...p, speed: parseFloat(e.target.value) }))} className="bg-slate-900 border border-slate-800 rounded text-[10px] mono px-1.5 py-1">
                {[0.5, 1, 2, 4].map(s => <option key={s} value={s}>{s}x</option>)}
              </select>
              <span className="mono text-[10px] text-slate-400 w-40 text-right">{timeSpan ? fmtDT(new Date(timeSpan.min + (timeSpan.max - timeSpan.min) * playhead.pos).toISOString()) : "—"}</span>
            </div>
          )}
        </section>

        {/* SEARCH */}
        <section className="flex flex-col sm:flex-row gap-2">
          <div className="flex-1 flex gap-2">
            <input id="search-input" value={searchText} onChange={e => setSearchText(e.target.value)} onKeyDown={e => e.key === "Enter" && runSearch()} placeholder='Try: "earthquakes above magnitude 5 near Japan" or "last 7 days"' className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs mono focus:outline-none focus:border-cyan-500" />
            <button onClick={runSearch} className="px-3 py-2 rounded-lg bg-cyan-500/15 border border-cyan-500/50 text-cyan-300 text-xs mono flex items-center gap-1"><Icon name="search" className="w-3.5 h-3.5" />Search</button>
          </div>
          {searchFilters && (
            <div className="flex items-center gap-1.5 flex-wrap">
              {searchFilters.minMag != null && <span className="text-[10px] mono px-2 py-1 rounded-full bg-slate-900 border border-slate-800">M{searchFilters.minMag}+</span>}
              {searchFilters.regionLabel && <span className="text-[10px] mono px-2 py-1 rounded-full bg-slate-900 border border-slate-800">{searchFilters.regionLabel}</span>}
              {searchFilters.days && <span className="text-[10px] mono px-2 py-1 rounded-full bg-slate-900 border border-slate-800">Last {searchFilters.days}d</span>}
              <button onClick={() => setSearchFilters(null)} className="text-[10px] text-slate-500 underline">clear</button>
            </div>
          )}
        </section>

        {/* MAIN GRID: GLOBE + INTELLIGENCE PANEL */}
        <div className="grid grid-cols-1 xl:grid-cols-[1fr_360px] gap-4">
          <div ref={globeContainerRef} className="relative rounded-xl overflow-hidden border border-slate-800 bg-slate-950" style={{ height: "640px" }}>
            <Planet3D events={visibleEvents} plates={plates} platesStatus={platesStatus} layers={layers} selectedEvent={selectedEvent} onSelectEvent={handleSelect} pulseGrid={pulseGrid} related={related} subsolar={subsolar} focusRequest={focusRequest} onFocusHandled={() => setFocusRequest(null)} />
            <div className="absolute top-3 left-3 flex items-center gap-2 mono text-[10px] px-2.5 py-1 rounded bg-slate-950/85 border border-slate-800">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" /> {loadingEvents ? "LOADING…" : `${visibleEvents.length} EVENTS · ${rangePreset.label.toUpperCase()}`}
            </div>
            <div className="absolute bottom-3 left-3 mono text-[9px] text-slate-500 bg-slate-950/70 px-2 py-1 rounded">Drag to rotate · Scroll/pinch to zoom · Click a marker to investigate</div>
          </div>

          {/* RIGHT PANEL */}
          <div className="space-y-3">
            {selectedEvent ? (
              <div className="glass rounded-xl p-4 mono text-xs space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <div className="text-[10px] text-violet-300 uppercase tracking-wider font-bold flex items-center gap-1"><Icon name="dna" className="w-3.5 h-3.5" />Event DNA</div>
                    <div className="text-lg font-extrabold text-white mt-1">M{selectedEvent.magnitude.toFixed(1)}</div>
                  </div>
                  <button onClick={() => setSelectedEvent(null)}><Icon name="x" className="w-4 h-4 text-slate-500" /></button>
                </div>
                <div className="text-slate-300">{selectedEvent.location}</div>
                <div className="grid grid-cols-2 gap-y-1.5 text-slate-400">
                  <div>Depth</div><div className="text-slate-200 text-right">{selectedEvent.depthKm?.toFixed(1)} km</div>
                  <div>Time (UTC)</div><div className="text-slate-200 text-right">{fmtDT(selectedEvent.timestamp)}</div>
                  <div>Coordinates</div><div className="text-slate-200 text-right">{selectedEvent.latitude.toFixed(2)}, {selectedEvent.longitude.toFixed(2)}</div>
                  <div>Tsunami flag</div><div className={selectedEvent.tsunami ? "text-rose-400 text-right" : "text-slate-200 text-right"}>{selectedEvent.tsunami ? "YES" : "NO"}</div>
                  <div>Quality</div><div className="text-emerald-300 text-right">OBSERVED (USGS)</div>
                </div>
                <div className="pt-2 border-t border-slate-800">
                  <div className="text-slate-500 mb-1">Nearby / related activity ({related.length})</div>
                  {related.slice(0, 4).map(r => (
                    <div key={r.event.id} className="flex justify-between text-[10px] text-slate-400 py-0.5">
                      <span>M{r.event.magnitude.toFixed(1)} · {Math.round(r.km)}km · {Math.round(r.hrs)}h</span>
                      <button onClick={() => handleFocus(r.event)} className="text-cyan-400 underline">view</button>
                    </div>
                  ))}
                  {!related.length && <div className="text-[10px] text-slate-600">No related activity found within 400km / 72h in the loaded dataset.</div>}
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => { handleFocus(selectedEvent); setMissionFlags(f => ({ ...f, inspectedCrossSection: true })); }} className="flex-1 py-1.5 rounded bg-cyan-500/15 border border-cyan-500/40 text-cyan-300">Fly to event</button>
                  <button onClick={() => setPinned(p => p.find(x => x.id === selectedEvent.id) ? p : [...p, selectedEvent].slice(-3))} className="flex-1 py-1.5 rounded bg-slate-900 border border-slate-700 flex items-center justify-center gap-1"><Icon name="pin" className="w-3 h-3" />Pin to compare</button>
                </div>
                <a href={selectedEvent.url} target="_blank" rel="noopener" className="block text-center text-[10px] text-slate-500 underline pt-1">View on USGS →</a>
              </div>
            ) : (
              <div className="glass rounded-xl p-4 mono text-xs text-slate-500 text-center">Click an earthquake marker on the globe to open its Event DNA.</div>
            )}

            <div className="glass rounded-xl p-4 space-y-2">
              <div className="mono text-[10px] uppercase tracking-wider text-slate-400 flex items-center gap-1"><Icon name="layers" className="w-3.5 h-3.5" />Planetary Cross-Section</div>
              <CrossSection event={selectedEvent} onDidView={() => {}} />
            </div>

            <div className="glass rounded-xl p-4 space-y-2">
              <div className="mono text-[10px] uppercase tracking-wider text-slate-400 flex items-center gap-1"><Icon name="radar" className="w-3.5 h-3.5" />Event Radar</div>
              <EventRadar referenceEvent={selectedEvent} events={filteredEvents} />
            </div>

            {pinned.length > 0 && (
              <div className="glass rounded-xl p-4 space-y-2 mono text-[10px]">
                <div className="uppercase tracking-wider text-slate-400 flex items-center gap-1"><Icon name="compare" className="w-3.5 h-3.5" />Comparison Lab ({pinned.length}/3)</div>
                {pinned.map(p => (
                  <div key={p.id} className="flex justify-between items-center border-b border-slate-800 py-1">
                    <span>M{p.magnitude.toFixed(1)} · {p.location.slice(0, 26)}</span>
                    <button onClick={() => setPinned(list => list.filter(x => x.id !== p.id))} className="text-slate-500"><Icon name="x" className="w-3 h-3" /></button>
                  </div>
                ))}
                {pinned.length === 2 && (
                  <div className="pt-1 text-slate-400">
                    Distance apart: {Math.round(haversineKm(pinned[0].latitude, pinned[0].longitude, pinned[1].latitude, pinned[1].longitude))} km<br />
                    Time difference: {Math.abs(Math.round((new Date(pinned[0].timestamp) - new Date(pinned[1].timestamp)) / 3600000))} hours
                  </div>
                )}
              </div>
            )}
          </div>
        </div>

        {/* LAYERS */}
        <section id="layer-panel" className="glass rounded-xl p-4">
          <div className="mono text-[10px] uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1"><Icon name="layers" className="w-3.5 h-3.5" />Multi-Layer Earth</div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            {LAYER_DEFS.map(l => (
              <div key={l.id} className={`flex items-center justify-between px-2.5 py-2 rounded-lg border text-[11px] mono ${l.available ? "border-slate-800 bg-slate-900/60" : "border-slate-900 bg-slate-950/60 opacity-60"}`}>
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" disabled={!l.available} checked={!!layers[l.id]} onChange={e => setLayers(v => ({ ...v, [l.id]: e.target.checked }))} />
                  {l.label}
                </label>
                {l.available ? (l.sourceKey && <ProvenanceButton sourceKey={l.sourceKey} onOpen={setProvenanceKey} />) : <span className="text-rose-400 text-[9px]">N/A</span>}
              </div>
            ))}
          </div>
          {platesStatus === "unavailable" && <div className="mt-2 text-[10px] text-amber-400 mono">Tectonic plate boundary data source is currently unreachable.</div>}
        </section>

        {/* PLANETARY STATE */}
        <section id="state-strip" className="glass rounded-xl p-4">
          <div className="mono text-[10px] uppercase tracking-wider text-slate-400 mb-3">Planetary State</div>
           <div className="flex flex-wrap gap-2 mb-3 text-[9px] mono">
             <span className="px-2 py-1 rounded-full border border-cyan-500/25 text-cyan-300 bg-cyan-500/5">USGS · Earthquakes</span>
             <span className="px-2 py-1 rounded-full border border-violet-500/25 text-violet-300 bg-violet-500/5">NOAA · Space Weather</span>
             <span className="px-2 py-1 rounded-full border border-emerald-500/25 text-emerald-300 bg-emerald-500/5">Open-Meteo · Weather</span>
             <span className="px-2 py-1 rounded-full border border-sky-500/25 text-sky-300 bg-sky-500/5">Open-Meteo · Air Quality</span>
           </div>
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mono text-[11px]">
            <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800">
              <div className="text-slate-500">SEISMICITY</div>
              <div className="text-lg font-bold text-amber-400">{filteredEvents.length}</div>
              <div className="text-emerald-400 text-[9px]">OBSERVED</div>
            </div>
            <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800">
              <div className="text-slate-500 flex items-center justify-between">SPACE WEATHER <ProvenanceButton sourceKey="noaa" onOpen={(k) => { setProvenanceKey(k); setMissionFlags(f => ({ ...f, viewedSolar: true })); }} /></div>
              <div className="text-lg font-bold text-cyan-400">{solar.available ? `Kp ${solar.kp}` : "—"}</div>
              <div className={solar.available ? "text-emerald-400 text-[9px]" : "text-rose-400 text-[9px]"}>{solar.available ? "OBSERVED" : "WAITING FOR FEED"}</div>
            </div>
            <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800">
              <div className="text-slate-500">AIR QUALITY</div>
              <div className="text-lg font-bold text-emerald-400">{cityData?.aqi?.us_aqi ?? "—"}</div>
              <div className={cityData?.aqi ? "text-emerald-400 text-[9px]" : "text-rose-400 text-[9px]"}>{cityData?.aqi ? "OBSERVED" : selectedCity ? "WAITING FOR FEED" : "NO LOCATION SELECTED"}</div>
            </div>
            <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800">
              <div className="text-slate-500">WEATHER</div>
              <div className="text-lg font-bold text-sky-400">{cityData?.weather?.temperature_2m != null ? `${cityData.weather.temperature_2m}°C` : "—"}</div>
              <div className={cityData?.weather ? "text-emerald-400 text-[9px]" : "text-slate-500 text-[9px]"}>{cityData?.weather ? "OBSERVED" : selectedCity ? "NO DATA" : "NO LOCATION SELECTED"}</div>
            </div>
            <div className="p-3 rounded-lg bg-slate-900/60 border border-slate-800">
              <div className="text-slate-500 flex items-center justify-between">PLANETARY PULSE <ProvenanceButton sourceKey="derived" onOpen={setProvenanceKey} /></div>
              <div className="text-lg font-bold text-violet-400">{pulseGrid.length ? (pulseGrid.reduce((a, c) => a + c.intensity, 0) / pulseGrid.length).toFixed(2) : "—"}</div>
              <div className="text-violet-400 text-[9px]">DERIVED</div>
            </div>
          </div>
        </section>

        {/* EARTH'S MEMORY */}
        <section id="planetary-memory" className="glass rounded-xl p-4">
          <div className="mono text-[10px] uppercase tracking-wider text-slate-400 mb-3">Earth's Memory — Regional History</div>
          <div className="flex gap-2 mb-3">
            <input value={memoryQuery} onChange={e => setMemoryQuery(e.target.value)} onKeyDown={e => e.key === "Enter" && runMemory()} placeholder="e.g. Tokyo, Santiago, Jakarta…" className="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs mono" />
            <button onClick={runMemory} className="px-3 py-2 rounded-lg bg-cyan-500/15 border border-cyan-500/50 text-cyan-300 text-xs mono">{memoryLoading ? "…" : "Search"}</button>
            <button onClick={async () => { const hits = await api.geocode(memoryQuery); if (hits[0]) selectCity(hits[0]); }} className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs mono">Set as location</button>
          </div>
          {memoryResult && (memoryResult.error ? (
            <div className="text-xs mono text-rose-400">{memoryResult.error}</div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mono text-[11px]">
              <div><div className="text-slate-500">Region</div><div className="text-slate-200">{memoryResult.loc.name}, {memoryResult.loc.country}</div></div>
              <div><div className="text-slate-500">Events (3yr, M3+)</div><div className="text-slate-200">{memoryResult.total}</div></div>
              <div><div className="text-slate-500">Strongest (3yr)</div><div className="text-slate-200">{memoryResult.maxMag ? `M${memoryResult.maxMag.toFixed(1)}` : "—"}</div></div>
              <div><div className="text-slate-500">Then vs Now</div><div className="text-slate-200">{memoryResult.recent30} in last 30d vs {memoryResult.monthlyAvg}/mo avg</div></div>
            </div>
          ))}
        </section>

        {/* MISSION MODE */}
        {mode === "mission" && (
          <section className="glass rounded-xl p-4 mono text-xs">
            <div className="uppercase tracking-wider text-slate-400 mb-2 flex items-center gap-1"><Icon name="mission" className="w-3.5 h-3.5" />Mission Objectives ({Object.values(missionFlags).filter(Boolean).length}/4)</div>
            {[
              ["foundBigQuake", "Load a range containing an earthquake ≥ M5"],
              ["inspectedCrossSection", "Fly to an event and inspect its cross-section"],
              ["viewedSolar", "Check the current space-weather (Kp) reading"],
              ["changedRange", "Use the Time Machine to change the loaded range"]
            ].map(([key, label]) => (
              <div key={key} className={`flex items-center gap-2 py-1 ${missionFlags[key] ? "text-emerald-400" : "text-slate-500"}`}>
                <span>{missionFlags[key] ? "✅" : "⬜"}</span>{label}
              </div>
            ))}
          </section>
        )}
      </div>

      {/* FOOTER */}
      <footer className="glass mt-6 px-5 py-6 mono text-[11px] text-slate-400">
        <div className="max-w-[1500px] mx-auto flex flex-col sm:flex-row justify-between gap-4">
          <div>
            <div className="text-white font-extrabold tracking-wide">EARTHPULSE</div>
            <div className="text-slate-500">Planetary Intelligence</div>
            <div className="mt-2">Made by Pratyush & Co.</div>
            <div>For updates: <a href="mailto:pratyushsisodiya36@gmail.com" className="text-cyan-400 underline">pratyushsisodiya36@gmail.com</a> · Instagram: <a href="https://instagram.com/skidz.company" target="_blank" rel="noopener" className="text-cyan-400 underline">@skidz.company</a></div>
          </div>
          <div className="flex gap-4">
            {["Terms", "Privacy", "Cookies", "Data Sources"].map(k => (
              <button key={k} onClick={() => k === "Data Sources" ? document.getElementById("layer-panel")?.scrollIntoView({ behavior: "smooth" }) : notify(`${k}: placeholder — replace with your reviewed policy before public launch.`)} className="underline hover:text-white">{k}</button>
            ))}
          </div>
        </div>
      </footer>

      {/* COMMAND PALETTE */}
      {cmdOpen && (
        <div className="fixed inset-0 z-[95] bg-slate-950/70 flex items-start justify-center pt-24 px-4" onClick={() => setCmdOpen(false)}>
          <div className="glass rounded-xl w-full max-w-md p-3 mono text-xs" onClick={e => e.stopPropagation()}>
            <div className="flex items-center gap-2 border-b border-slate-800 pb-2 mb-2">
              <span className="text-cyan-400">/</span>
              <input autoFocus value={cmdText} onChange={e => setCmdText(e.target.value)} onKeyDown={e => e.key === "Enter" && filteredCommands[0] && runCommand(filteredCommands[0])} placeholder="earthquake, solar, time, compare, orbit, fullscreen…" className="flex-1 bg-transparent outline-none" />
            </div>
            {filteredCommands.map(c => <button key={c} onClick={() => runCommand(c)} className="block w-full text-left px-2 py-1.5 rounded hover:bg-slate-800 text-slate-300">/{c}</button>)}
          </div>
        </div>
      )}

      <ProvenanceDrawer sourceKey={provenanceKey} onClose={() => setProvenanceKey(null)} />

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[99] glass rounded-lg px-4 py-2 mono text-xs text-slate-200">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
